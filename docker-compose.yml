services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "php artisan migrate --force && (php artisan radio:sync-r2 || echo 'R2 sync failed; continuing with the existing database') && exec php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: lofi_radio_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radio_worker
    restart: unless-stopped
    working_dir: /app
    command: sh -c "php artisan migrate --force && php artisan radio:worker --interval=$${RADIO_WORKER_INTERVAL_SECONDS:-1}"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: lofi_radio_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      RADIO_WORKER_INTERVAL_SECONDS: 1
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lofi_radio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: react_app
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local